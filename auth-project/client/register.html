<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>რეგისტრაცია</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="themeBtn" class="theme-toggle">🌙</button>

    <div class="auth-container">
        <form id="regForm">
            <h2>რეგისტრაცია</h2>
            <input type="text" id="regUser" placeholder="მომხმარებლის სახელი" required>
            <input type="email" id="regEmail" placeholder="ელ-ფოსტა" required>
            <input type="password" id="regPass" placeholder="პაროლი" required>
            <input type="password" id="regConfirm" placeholder="გაიმეორეთ პაროლი" required>
            <button type="submit">რეგისტრაცია</button>
            <p class="switch-text">უკვე გაქვთ ანგარიში? <a href="index.html">შედით</a></p>
        </form>
    </div>

    <script src="register.js"></script>
</body>
</html>
