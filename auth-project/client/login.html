<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ავტორიზაცია - შესვლა</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="themeBtn" class="theme-toggle">🌙</button>

    <div class="auth-container">
        <form id="loginForm">
            <h2>სისტემაში შესვლა</h2>
            <p id="message" style="color: red; font-size: 13px;"></p>
            <input type="email" id="email" placeholder="ელ-ფოსტა" required>
            <input type="password" id="password" placeholder="პაროლი" required>
            <button type="submit">შესვლა</button>
            <p class="switch-text">არ გაქვთ ანგარიში? <a href="register.html">დარეგისტრირდით</a></p>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
